<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Resolio</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#0d0d0f; --surface:#17171a; --surface2:#212125; --line:#2b2b31;
  --text:#f3f3ef; --muted:#8e8e96; --dim:#5d5d65;
  --accent:#f5c518; --accent-ink:#1c1600; --accent-soft:rgba(245,197,24,.12);
  --ko:#e0675d; --ko-soft:rgba(224,103,93,.12); --inj:#7d9cc9; --inj-soft:rgba(125,156,201,.12);
  --r:18px;
  --safe-t:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --safe-b:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-top:var(--safe-t)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.muted{color:var(--muted)}
#app{max-width:520px;margin:0 auto;padding:12px 18px calc(96px + var(--safe-b))}
.brand{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:-.02em;font-size:20px;display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.brand .sync{margin-left:auto;font-family:Inter;font-weight:500;font-size:12px;color:var(--muted)}
h1{font-family:Archivo,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;margin:2px 0 0}
h2{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;margin:28px 0 12px;letter-spacing:-.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-top:14px}

/* summary */
.summary{display:flex;align-items:center;gap:16px;margin:18px 0 20px;padding:16px;background:var(--surface);border-radius:var(--r)}
.ring{width:64px;height:64px;flex:none}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.summary b{font-family:Archivo;font-size:22px}
.validated-banner{margin:-6px 0 18px;padding:12px 16px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;display:flex;gap:8px;align-items:center}

/* goal cards */
.goal{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid transparent}
.goal.done{border-color:rgba(245,197,24,.35)}
.goal.injured{opacity:.75}
.g-top{display:flex;align-items:center;gap:12px}
.emoji{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex:none}
.g-title{flex:1;min-width:0}
.g-name{font-weight:700;font-size:16px}
.g-meta{color:var(--muted);font-size:13.5px;margin-top:1px}
.g-meta b{color:var(--text);font-weight:700}
.add{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;transition:transform .1s}
.add:active{transform:scale(.92)}
.add svg{width:22px;height:22px;stroke:var(--text)}
.goal:not(.done) .add{background:var(--accent)}
.goal:not(.done) .add svg{stroke:var(--accent-ink)}
.bar{height:6px;border-radius:6px;background:var(--surface2);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text);border-radius:6px;transition:width .4s}
.goal.done .bar i{background:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.ko{background:var(--ko-soft);color:var(--ko)}
.tag.inj{background:var(--inj-soft);color:var(--inj)}
.days{display:flex;gap:6px;margin-top:14px}
.day{flex:1;height:38px;border-radius:11px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.today{outline:1.5px solid var(--dim)}
.day[disabled]{opacity:.35}

/* journal */
.entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .e-emoji{font-size:18px;width:28px;text-align:center}
.entry .e-main{flex:1;min-width:0}
.entry .e-title{font-weight:600;font-size:14.5px}
.entry .e-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{font-size:12.5px;color:var(--dim);padding:8px 4px;font-weight:600}
.del.confirm{color:var(--ko)}
.card{background:var(--surface);border-radius:var(--r);padding:4px 16px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border-radius:var(--r);font-size:14px}

/* history */
.hist-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.week-row{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.week-row summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
.week-row summary::-webkit-details-marker{display:none}
.week-row .wr-label{flex:1;font-weight:600}
.week-row .wr-label small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.wr-detail{padding:0 16px 14px}
.wr-goal{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.wr-goal span:last-child{color:var(--muted)}

/* goals list */
.gl-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 14px;margin-bottom:10px}
.gl-item .g-title{cursor:pointer}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:32px;height:22px;border-radius:7px;background:var(--surface2);color:var(--muted);font-size:11px}
.mv button[disabled]{opacity:.25}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:700;font-size:15.5px;background:var(--accent);color:var(--accent-ink)}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px dashed var(--line)}
.btn.quiet{background:var(--surface2);color:var(--text)}
.btn.danger{background:none;color:var(--ko);height:44px;font-weight:600}
.btn.danger.confirm{background:var(--ko-soft)}

/* profile */
.prof-head{display:flex;align-items:center;gap:16px;margin:16px 0 8px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:Archivo;font-weight:900;font-size:34px;color:var(--accent);overflow:hidden;flex:none;border:2px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof-head .pn{font-family:Archivo;font-weight:800;font-size:26px;letter-spacing:-.02em}
.edit-link{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px}
.stat .v{font-family:Archivo;font-weight:800;font-size:26px;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:500}
.stat.hl .v{color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border-radius:16px;padding:14px 8px;text-align:center}
.badge .b-e{font-size:28px;line-height:1.1}
.badge .b-n{font-weight:700;font-size:12.5px;margin-top:6px}
.badge .b-d{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.3}
.badge.locked .b-e{filter:grayscale(1);opacity:.28}
.badge.locked .b-n{color:var(--dim)}
.badge.got{box-shadow:inset 0 0 0 1px rgba(245,197,24,.35)}
.foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:28px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,13,15,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b));display:flex;justify-content:center;z-index:10}
nav[hidden]{display:none}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--text)}
nav button.on svg{stroke:var(--accent)}

/* sheet */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#overlay.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:92vh;overflow-y:auto}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sh-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sh-title .t{font-family:Archivo;font-weight:800;font-size:21px;letter-spacing:-.01em}
.field{margin-bottom:16px}
.field label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;height:50px;border-radius:14px;background:var(--surface2);border:1.5px solid transparent;padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.big{height:64px;font-family:Archivo;font-weight:800;font-size:28px;text-align:center}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.chip.date{min-width:44px;padding:0 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;font-size:11px}
.chip.date b{font-size:15px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{min-height:46px;border-radius:13px;background:var(--surface2);font-weight:600;font-size:13.5px;color:var(--muted);padding:6px}
.seg button.on{background:var(--text);color:var(--bg)}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.75}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--surface2);font-size:24px;font-weight:600}
.stepper .inp{text-align:center;font-family:Archivo;font-weight:800;font-size:22px}
.emojis{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.emojis button{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--surface2);flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border-radius:14px;padding:14px}
.switch .k{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch.on .k{background:var(--inj)}
.switch.on .k::after{transform:translateX(20px)}
.switch .s-t{font-weight:600}
.switch .s-d{font-size:12.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.recap-hero{text-align:center;padding:8px 0 14px}
.recap-hero .big{font-size:56px}
.recap-hero .t{font-family:Archivo;font-weight:900;font-size:28px;letter-spacing:-.02em;margin-top:6px}
.recap-hero.ok .t{color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* onboarding / loading */
.onb{min-height:80vh;display:flex;flex-direction:column;justify-content:center;padding-top:20px}
.onb .logo{font-family:Archivo;font-weight:900;font-size:44px;letter-spacing:-.04em;line-height:1}
.onb .logo span{color:var(--accent)}
.onb p{color:var(--muted);font-size:16px;margin:10px 0 30px}
.onb .defaults{background:var(--surface);border-radius:var(--r);padding:6px 16px;margin:6px 0 22px}
.onb .defaults div{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.onb .defaults div:last-child{border:0}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);text-align:center}
.pulse{width:14px;height:14px;background:var(--accent);border-radius:4px;transform:rotate(45deg);animation:p 1s infinite alternate;margin:0 auto 14px}
@keyframes p{to{opacity:.25;transform:rotate(225deg)}}

/* connexion */
.auth{justify-content:flex-start;padding-top:8vh}
.btn.google{background:#fff;color:#1f1f1f;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link-btn{color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.auth-switch{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
.auth-msg{font-size:13.5px;margin:-4px 0 14px;color:var(--accent)}
.auth-msg.ko{color:var(--ko)}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="pulse"></div>Chargement…</div></div></div>
<nav id="nav" hidden><div class="in">
  <button data-act="tab" data-tab="semaine"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semaine</button>
  <button data-act="tab" data-tab="historique"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4h4M12 7.5V12l3 2"/></svg>Historique</button>
  <button data-act="tab" data-tab="objectifs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Objectifs</button>
  <button data-act="tab" data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-4 4-5.8 7.5-5.8s6.3 1.8 7.5 5.8"/></svg>Profil</button>
</div></nav>
<div id="overlay" data-act="close-sheet"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ============ utils ============ */
const $ = s => document.querySelector(s);
const CAP = window.Capacitor;
const IS_APP = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const _plugins = {};
const plugin = n => _plugins[n] || (_plugins[n] = (CAP.Plugins && CAP.Plugins[n]) || CAP.registerPlugin(n));
let APP_VERSION = '';
const LOCAL_KEY = 'resolio-v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey = k => { const [a,b,c] = k.split('-').map(Number); return new Date(a, b-1, c); };
const addDays = (k, n) => { const d = pkey(k); d.setDate(d.getDate()+n); return dkey(d); };
const mondayKey = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6) % 7)); return dkey(x); };
const curWeek = () => mondayKey();
const todayKey = () => dkey(new Date());
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONTHS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS = ['L','M','M','J','V','S','D'];
const DAYS_L = ['Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.','Dim.'];
function weekLabel(k, withYear) {
  const a = pkey(k), b = pkey(addDays(k, 6));
  const y = withYear && b.getFullYear() !== new Date().getFullYear() ? ' ' + b.getFullYear() : '';
  if (a.getMonth() === b.getMonth()) return `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]}${y}`;
  return `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}${y}`;
}
const fmt = n => { n = Math.round((+n || 0) * 10) / 10; return n.toLocaleString('fr-FR'); };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============ configuration & serveur (Supabase) ============
 * L'app lit et écrit directement dans la base Supabase : rien n'est stocké sur le téléphone,
 * à part la session de connexion. Toutes les écritures passent par write() (file d'attente).
 */
const CFG = window.RESOLIO_CONFIG || {};
const APP_SCHEME = 'com.quentinfayolle.resolio';
function redirectUrl(kind) {
  if (IS_APP) return `${APP_SCHEME}://${kind === 'reset' ? 'reset-password' : 'auth-callback'}`;
  return location.origin + location.pathname + (kind === 'reset' ? '?reset=1' : '');
}

// Conversions ligne de la base <-> objet de l'app
const profileFromRow = (r, user) => ({
  firstName: r.first_name || '', lastName: r.last_name || '', name: r.first_name || '',
  photo: r.avatar_url || null, birthDate: r.birth_date || '', city: r.city || '',
  startWeek: r.start_week || null, createdAt: Date.parse(r.created_at) || Date.now(),
  email: (user && user.email) || ''
});
const profileToRow = p => ({
  first_name: (p.firstName || '').trim(), last_name: (p.lastName || '').trim(), avatar_url: p.photo || null,
  birth_date: p.birthDate || null, city: (p.city || '').trim() || null, start_week: p.startWeek || null
});
const goalFromRow = r => ({
  id: r.id, name: r.name, emoji: r.emoji || '🎯', cat: r.cat, type: r.type, unit: r.unit || '',
  activities: r.activities || [], distance: !!r.distance, createdWeek: r.created_week, archivedWeek: r.archived_week || null,
  position: r.position || 0, targetHistory: r.target_history || [], injuries: r.injuries || []
});
const goalToRow = (g, uid) => ({
  id: g.id, user_id: uid, name: g.name, emoji: g.emoji || '🎯', cat: g.cat || 'other', type: g.type || 'count', unit: g.unit || '',
  activities: g.activities || [], distance: !!g.distance, created_week: g.createdWeek, archived_week: g.archivedWeek || null,
  position: g.position || 0, target_history: g.targetHistory || [], injuries: g.injuries || []
});
const weekToRow = (k, d, uid) => ({ user_id: uid, week: k, closed: !!d.closed, result: d.result || null, recap_seen: !!d.recapSeen });
const entryToRow = (e, k, uid) => ({
  id: e.id, user_id: uid, goal_id: e.goalId, week: k, date: e.date, cat: e.cat || 'other', amount: num(e.amount) || 0,
  book: e.book || null, activity: e.activity || null, duration: e.duration || null, distance: e.distance || null,
  note: e.note || null, at: Math.round(e.at || 0)
});
function entryFromRow(r) {
  const e = { id: r.id, goalId: r.goal_id, cat: r.cat, date: r.date, amount: num(r.amount), at: Number(r.at) || 0 };
  if (r.book) e.book = r.book;
  if (r.activity) e.activity = r.activity;
  if (r.duration) e.duration = num(r.duration);
  if (r.distance) e.distance = num(r.distance);
  if (r.note) e.note = r.note;
  return e;
}

function createSupabaseBackend() {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase) return null;
  const storage = IS_APP ? {
    getItem: k => plugin('Preferences').get({ key: k }).then(r => r.value),
    setItem: (k, v) => plugin('Preferences').set({ key: k, value: v }),
    removeItem: k => plugin('Preferences').remove({ key: k }),
  } : window.localStorage;
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
    auth: { storage, flowType: 'pkce', detectSessionInUrl: !IS_APP, persistSession: true, autoRefreshToken: true }
  });
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  const fetchAll = async (table, order) => {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const rows = chk(await sb.from(table).select('*').order(order).range(from, from + 999));
      out.push(...rows);
      if (rows.length < 1000) return out;
    }
  };
  const chunks = (arr, n = 500) => { const r = []; for (let i = 0; i < arr.length; i += n) r.push(arr.slice(i, i + n)); return r; };
  const providers = u => (u && u.app_metadata && u.app_metadata.providers) || [];
  return {
    // ----- connexion -----
    async getUser() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    onAuth(cb) { sb.auth.onAuthStateChange((event, session) => setTimeout(() => cb(event, session ? session.user : null), 0)); },
    hasPassword: u => providers(u).includes('email'),
    usesGoogle: u => providers(u).includes('google'),
    async signIn(email, password) { chk(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, firstName, lastName) {
      const d = chk(await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectUrl('auth'), data: { first_name: firstName, last_name: lastName } } }));
      if (d.user && Array.isArray(d.user.identities) && d.user.identities.length === 0) { const e = new Error('User already registered'); e.code = 'user_already_exists'; throw e; }
      return { needsConfirm: !d.session };
    },
    async signInGoogle() {
      if (IS_APP) {
        const d = chk(await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl('auth'), skipBrowserRedirect: true } }));
        await plugin('Browser').open({ url: d.url });
      } else {
        chk(await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl('auth') } }));
      }
    },
    // Retour d'un lien (Google, email de confirmation, mot de passe oublié) : com.quentinfayolle.resolio://...?code=...
    async handleDeepLink(url) {
      if (!url || !url.startsWith(APP_SCHEME + '://')) return null;
      try { await plugin('Browser').close(); } catch (e) {}
      const q = new URL(url.replace(APP_SCHEME + '://', 'https://app/'));
      const params = new URLSearchParams((q.search || '').slice(1) + '&' + (q.hash || '').slice(1));
      if (params.get('error_description')) throw new Error(params.get('error_description'));
      const code = params.get('code');
      if (!code) return null;
      chk(await sb.auth.exchangeCodeForSession(code));
      return url.includes('reset-password') ? 'reset' : 'auth';
    },
    async resetPassword(email) { chk(await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl('reset') })); },
    async updatePassword(password) { chk(await sb.auth.updateUser({ password })); },
    async signOut() { await sb.auth.signOut({ scope: 'local' }); },
    async deleteAccount(uid) {
      const files = (await sb.storage.from('avatars').list(uid)).data || [];
      if (files.length) await sb.storage.from('avatars').remove(files.map(f => `${uid}/${f.name}`));
      chk(await sb.rpc('delete_my_account'));
      await sb.auth.signOut({ scope: 'local' });
    },
    // ----- données -----
    async loadAll(user) {
      const uid = user.id;
      const [prow, goals, weeks, entries] = await Promise.all([
        sb.from('profiles').select('*').eq('id', uid).maybeSingle().then(chk),
        fetchAll('goals', 'position'), fetchAll('weeks', 'week'), fetchAll('entries', 'at'),
      ]);
      const out = { profile: profileFromRow(prow || {}, user), goals: goals.map(goalFromRow), weeks: {} };
      for (const w of weeks) out.weeks[w.week] = { week: w.week, closed: w.closed, result: w.result || undefined, recapSeen: w.recap_seen, entries: [] };
      for (const r of entries) {
        const w = out.weeks[r.week] || (out.weeks[r.week] = { week: r.week, closed: false, entries: [] });
        w.entries.push(entryFromRow(r));
      }
      if (!prow) chk(await sb.from('profiles').upsert({ id: uid }));
      return out;
    },
    async saveProfile(uid, p) { chk(await sb.from('profiles').update(profileToRow(p)).eq('id', uid)); },
    async uploadAvatar(uid, blob) {
      const path = `${uid}/avatar-${Date.now()}.jpg`;
      chk(await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true }));
      const old = ((await sb.storage.from('avatars').list(uid)).data || []).map(f => `${uid}/${f.name}`).filter(n => n !== path);
      if (old.length) await sb.storage.from('avatars').remove(old);
      return sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    },
    async upsertGoals(rows) { if (rows.length) chk(await sb.from('goals').upsert(rows)); },
    async upsertWeeks(rows) { for (const c of chunks(rows)) chk(await sb.from('weeks').upsert(c, { onConflict: 'user_id,week' })); },
    async insertEntries(rows) { for (const c of chunks(rows)) chk(await sb.from('entries').insert(c)); },
    async deleteEntries(ids) { if (ids.length) chk(await sb.from('entries').delete().in('id', ids)); },
    async replaceAllData(uid, goals, weeks, entries) {
      chk(await sb.from('goals').delete().eq('user_id', uid));      // efface aussi les enregistrements (cascade)
      chk(await sb.from('weeks').delete().eq('user_id', uid));
      for (const c of chunks(goals)) chk(await sb.from('goals').insert(c));
      for (const c of chunks(weeks)) chk(await sb.from('weeks').insert(c));
      for (const c of chunks(entries)) chk(await sb.from('entries').insert(c));
    },
  };
}

// File d'attente des écritures : une à la fois, dans l'ordre. En cas d'échec, on recharge depuis la base.
let writeChain = Promise.resolve(), pendingWrites = 0;
function write(fn) {

    console.error(e);
    toast(navigator.onLine === false ? 'Pas de connexion : modification non enregistrée' : 'Erreur : modification non enregistrée');
    await reloadData(true);

}

const saveGoals = items => {

const saveWeek = (k, doc) => {
  const old = state.weeks[k] || { entries: [] };
  state.weeks[k] = doc; render();
  const before = new Set((old.entries || []).map(e => e.id)), after = new Set((doc.entries || []).map(e => e.id));
  const added = (doc.entries || []).filter(e => !before.has(e.id)), removed = [...before].filter(id => !after.has(id));
  const u = uid();
  return write(async () => {
    await backend.upsertWeeks([weekToRow(k, doc, u)]);
    if (added.length) await backend.insertEntries(added.map(e => entryToRow(e, k, u)));

async function loadData() {
  if (!state.user) return;

    if (state.phase === 'setup') state.legacy = await readLegacyData();

// Recharge sans écran de chargement (retour dans l'app, ou après une erreur d'écriture)
async function reloadData(force) {
  if (!state.user || (!force && pendingWrites) || !['app', 'offline'].includes(state.phase)) return;

function errText(e) {
  const code = (e && (e.code || e.error_code)) || '', msg = String((e && e.message) || e || '');
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if (code === 'email_not_confirmed' || /email not confirmed/i.test(msg)) return 'Confirme d\'abord ton email : clique sur le lien reçu (pense aux spams).';
  if (code === 'user_already_exists' || /already registered/i.test(msg)) return 'Un compte existe déjà avec cet email. Connecte-toi.';
  if (code === 'weak_password' || /password should be/i.test(msg)) return 'Mot de passe trop faible : 8 caractères minimum.';
  if (/rate limit|over_email_send/i.test(code + msg)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if (code === 'same_password') return 'Choisis un mot de passe différent de l\'ancien.';
  if (/failed to fetch|network|load failed/i.test(msg) || navigator.onLine === false) return 'Pas de connexion internet.';
  return msg || 'Une erreur est survenue.';
}

async function importIntoAccount(d) {

  for (const [k, w] of Object.entries(d.weeks || {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || pkey(k).getDay() !== 1) continue;
    weeks.push(weekToRow(k, w, u));
    for (const e of (w.entries || [])) if (ids.has(e.goalId) && e.date >= k && e.date < addDays(k, 7)) entries.push(entryToRow(e, k, u));

}

/* ============ goal logic ============ */
const TYPE_INFO = {
  count: { label: 'Nombre de fois', sub: 'ex. 3 séances' },
  quantity: { label: 'Quantité', sub: 'ex. 100 pages, 20 km' },
  daily: { label: 'Chaque jour', sub: 'ex. 7 jours / 7' },
  once: { label: 'Une fois', sub: 'à cocher' }
};
function defaultUnit(type, cat) {
  if (type === 'quantity') return cat === 'reading' ? 'pages' : cat === 'sport' ? 'km' : 'min';
  if (type === 'count') return cat === 'sport' ? 'séances' : 'fois';
  if (type === 'daily') return 'jours';
  return '';
}
function targetFor(g, wk) {
  const h = (g.targetHistory || []).slice().sort((a, b) => a.from < b.from ? -1 : 1);
  if (g.type === 'once') return 1;
  if (!h.length) return g.target || 1;
  let t = h[0].target;
  for (const x of h) if (x.from <= wk) t = x.target;
  return t;
}
const isActive = (g, wk) => g.createdWeek <= wk && (!g.archivedWeek || wk < g.archivedWeek);
const isInjured = (g, wk) => (g.injuries || []).some(p => p.from <= wk && (!p.to || wk < p.to));
const injuredNow = g => (g.injuries || []).some(p => !p.to);
function doneFor(g, entries) {
  const es = (entries || []).filter(e => e.goalId === g.id);
  if (g.type === 'quantity') return es.reduce((s, e) => s + num(e.amount), 0);
  if (g.type === 'daily') return new Set(es.map(e => e.date)).size;
  if (g.type === 'once') return Math.min(es.length, 1);
  return es.length;
}
function computeResult(wk, doc) {
  const goals = goalsList().filter(g => isActive(g, wk)).map(g => {
    const target = targetFor(g, wk), done = doneFor(g, doc.entries);
    const status = isInjured(g, wk) ? 'injured' : done >= target ? 'ok' : 'ko';
    return { id: g.id, name: g.name, emoji: g.emoji, unit: g.unit || '', type: g.type, target, done, status };
  });
  const counted = goals.filter(x => x.status !== 'injured');
  return { goals, validated: counted.length > 0 && counted.every(x => x.status === 'ok'), exempt: counted.length === 0 };
}
const liveResult = () => computeResult(curWeek(), weekDoc(curWeek()));

/* ============ weekly closing (lundi 00:00) ============ */
let recapOpenFor = null;
function maintenance() {
  if (state.phase !== 'app' || !state.profile || !state.goals) return;
  const cur = curWeek(), closing = [];
  let k = state.profile.startWeek || cur, guard = 0;
  const prev = addDays(cur, -7);
  while (k < cur && guard++ < 520) {
    const w = state.weeks[k];
    if (!w || !w.closed) {
      const doc = w ? clone(w) : { week: k, entries: [] };
      doc.closed = true;
      doc.result = computeResult(k, doc);
      doc.recapSeen = k !== prev;
      state.weeks[k] = doc;
      closing.push(weekToRow(k, doc, uid()));
    }
    k = addDays(k, 7);
  }
  if (closing.length) write(() => backend.upsertWeeks(closing));
  const pw = state.weeks[prev];
  if (pw && pw.closed && pw.result && !pw.recapSeen && recapOpenFor !== prev && !sheetOpen()) openRecap(prev);
}
setInterval(() => {
  if (curWeek() !== lastWeekSeen) { lastWeekSeen = curWeek(); maintenance(); render(); }
}, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastWeekSeen = curWeek(); reloadData(false); } });

/* ============ stats & badges ============ */
function computeStats() {
  let pages = 0, sessions = 0, km = 0, minutes = 0, entries = 0;
  const books = new Set();
  for (const w of Object.values(state.weeks)) for (const e of (w.entries || [])) {
    entries++;
    if (e.cat === 'reading') { pages += num(e.amount); if (e.book) books.add(e.book.trim().toLowerCase()); }
    if (e.cat === 'sport') { sessions++; km += num(e.distance); minutes += num(e.duration); }
  }
  const closed = Object.values(state.weeks).filter(w => w.closed && w.result).sort((a, b) => a.week < b.week ? -1 : 1);
  let cur = 0, best = 0, validated = 0, total = 0;
  for (const w of closed) {
    if (w.result.exempt) continue;
    total++;
    if (w.result.validated) { cur++; validated++; best = Math.max(best, cur); } else cur = 0;
  }
  const live = liveResult();
  if (live.validated) { cur++; best = Math.max(best, cur); }
  return { pages, sessions, km, minutes, entries, books: books.size, streak: cur, best, validated, total };
}

  if (g.type === 'quantity') { const a = num(v['en-amount']); if (a <= 0) { toast('Indique ' + (g.unit ? 'le nombre de ' + g.unit : 'une quantité')); return; } e.amount = a; }
  else e.amount = 1;

  if (entryDraft.activity) e.activity = entryDraft.activity;

  if (num(v['en-dist']) > 0) e.distance = num(v['en-dist']);
  if (v['en-note'] && v['en-note'].trim()) e.note = v['en-note'].trim();
  const cur = curWeek(), doc = clone(weekDoc(cur));
  const before = computeResult(cur, doc).goals.find(x => x.id === g.id);
  doc.entries.push(e); doc.week = cur; doc.closed = false;
  closeSheet(); saveWeek(cur, doc);
  const after = computeResult(cur, doc);
  const ga = after.goals.find(x => x.id === g.id);
  if (after.validated) toast('🔥 Semaine validée !');
  else if (ga && ga.status === 'ok' && before && before.status !== 'ok') toast('✓ Objectif atteint !');
  else toast('Enregistré');
}
function toggleDay(id, date) {

  else doc.entries.push({ id: rid(), goalId: id, cat: g.cat || 'other', date, amount: 1, at: Date.now() });

}

function ageFrom(d) {
  if (!d) return 0;
  const b = new Date(d + 'T00:00:00'), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a > 0 && a < 130 ? a : 0;
}

function resizeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 320, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
async function exportBackup() {
  const data = JSON.stringify({ app: 'Resolio', v: 2, exportedAt: new Date().toISOString(), profile: state.profile, goals: { items: goalsList() }, weeks: state.weeks }, null, 1);
  const name = 'resolio-sauvegarde-' + todayKey() + '.json';
  if (IS_APP) {
    try {
      const w = await plugin('Filesystem').writeFile({ path: name, data, directory: 'CACHE', encoding: 'utf8' });
      await plugin('Share').share({ title: 'Sauvegarde Resolio', dialogTitle: 'Sauvegarder Resolio', files: [w.uri] });
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Export impossible'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
let importBusy = false;
async function doImport(txt) {
  if (importBusy) return;
  let d;
  try { d = JSON.parse(String(txt || '').trim()); } catch (e) { toast('Sauvegarde illisible'); return; }
  if (!d || !d.weeks || !d.goals || !Array.isArray(d.goals.items)) { toast('Ce n\'est pas une sauvegarde Resolio'); return; }
  importBusy = true; toast('Import en cours…');
  try { await importIntoAccount(d); closeSheet(); toast('Sauvegarde importée ✓'); await loadData(); }
  catch (e) { toast('Import impossible : ' + errText(e)); }
  importBusy = false;
}
document.addEventListener('change', async e => {
  if (e.target.id === 'imp-file' && e.target.files[0]) { try { doImport(await e.target.files[0].text()); } catch (err) { toast('Fichier illisible'); } return; }
  if (e.target.id === 'pe-photo' && e.target.files[0]) {
    try { photoDraft = await resizeImage(e.target.files[0]); renderProfileEditor(); }
    catch (err) { toast('Impossible de lire cette image'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'au-pw') authAction(authMode === 'signup' ? 'signup' : 'login');
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('en-') && e.target.id !== 'en-book') { e.preventDefault(); saveEntry(); }
});
window.flfBack = () => {
  if (sheetOpen()) { closeSheet(); return true; }
  if (state.profile && tab !== 'semaine') { tab = 'semaine'; render(); window.scrollTo(0, 0); return true; }
  return false;
};
window.flfResume = () => { lastWeekSeen = curWeek(); reloadData(false); };
window.addEventListener('online', () => { render(); if (state.phase === 'offline') loadData(); else reloadData(false); });
window.addEventListener('offline', () => render());
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== tab) { tab = t; render(); } });

/* ============ boot ============ */
(async function boot() {
  if (IS_APP) {
    try {
      const App = plugin('App');
      App.addListener('backButton', () => { if (!window.flfBack()) App.exitApp(); });
      App.addListener('resume', () => window.flfResume());
      App.getInfo().then(i => { APP_VERSION = i.version; if (tab === 'profil') render(); }).catch(() => {});
    } catch (e) {}
  }
  backend = window.__RESOLIO_TEST_BACKEND__ || createSupabaseBackend();
  if (!backend) { state.phase = 'config'; render(); return; }

  const resetFromWeb = !IS_APP && new URLSearchParams(location.search).get('reset') === '1';
  backend.onAuth((event, user) => {
    if (event === 'PASSWORD_RECOVERY') setTimeout(() => openPasswordSheet(true), 300);
    if (user && (!state.user || state.user.id !== user.id)) { state.user = user; loadData(); }
    else if (user) state.user = user;
    else if (!user && state.user) {
      Object.assign(state, { user: null, profile: null, goals: null, weeks: {}, phase: 'auth', legacy: null });
      authMode = 'login'; tab = 'semaine'; render();
    }
  });
  if (IS_APP) {
    plugin('App').addListener('appUrlOpen', async ev => {
      try {
        const kind = await backend.handleDeepLink(ev.url);
        if (kind === 'reset') setTimeout(() => openPasswordSheet(true), 600);
      } catch (e) { state.phase = state.user ? state.phase : 'auth'; authErr = errText(e); render(); }
    });
  }
  const user = await backend.getUser().catch(() => null);
  if (user && !state.user) { state.user = user; await loadData(); }
  else if (!state.user) { state.phase = 'auth'; render(); }
  if (resetFromWeb) { history.replaceState(null, '', location.pathname + location.hash); if (state.user) openPasswordSheet(true); }
})();
</script>
</body>
