<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Resolio</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#0d0d0f; --surface:#17171a; --surface2:#212125; --line:#2b2b31;
  --text:#f3f3ef; --muted:#8e8e96; --dim:#5d5d65;
  --accent:#f5c518; --accent-ink:#1c1600; --accent-soft:rgba(245,197,24,.12);
  --ko:#e0675d; --ko-soft:rgba(224,103,93,.12); --inj:#7d9cc9; --inj-soft:rgba(125,156,201,.12);
  --r:18px;
  --safe-t:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --safe-b:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-top:var(--safe-t)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.muted{color:var(--muted)}
#app{max-width:520px;margin:0 auto;padding:12px 18px calc(96px + var(--safe-b))}
.brand{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:-.02em;font-size:20px;display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.brand .sync{margin-left:auto;font-family:Inter;font-weight:500;font-size:12px;color:var(--muted)}
h1{font-family:Archivo,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;margin:2px 0 0}
h2{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;margin:28px 0 12px;letter-spacing:-.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-top:14px}

/* summary */
.summary{display:flex;align-items:center;gap:16px;margin:18px 0 20px;padding:16px;background:var(--surface);border-radius:var(--r)}
.ring{width:64px;height:64px;flex:none}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.summary b{font-family:Archivo;font-size:22px}
.validated-banner{margin:-6px 0 18px;padding:12px 16px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;display:flex;gap:8px;align-items:center}

/* goal cards */
.goal{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid transparent}
.goal.done{border-color:rgba(245,197,24,.35)}
.goal.injured{opacity:.75}
.g-top{display:flex;align-items:center;gap:12px}
.emoji{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex:none}
.g-title{flex:1;min-width:0}
.g-name{font-weight:700;font-size:16px}
.g-meta{color:var(--muted);font-size:13.5px;margin-top:1px}
.g-meta b{color:var(--text);font-weight:700}
.add{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;transition:transform .1s}
.add:active{transform:scale(.92)}
.add svg{width:22px;height:22px;stroke:var(--text)}
.goal:not(.done) .add{background:var(--accent)}
.goal:not(.done) .add svg{stroke:var(--accent-ink)}
.bar{height:6px;border-radius:6px;background:var(--surface2);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text);border-radius:6px;transition:width .4s}
.goal.done .bar i,.bar.full i{background:var(--accent)}
.bar.lim i{background:var(--muted)}
.bar.over i{background:var(--ko)}
.bar.sm{height:5px;margin-top:6px}
.mbars{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.mrow span{font-size:12.5px;color:var(--muted);font-weight:600}
.add.neutral{background:var(--surface2)!important}
.add.neutral svg{stroke:var(--text)!important}
.chips.multi .chip.on{background:var(--accent);color:var(--accent-ink)}
.chips.small .chip{height:34px;font-size:13px;padding:0 11px}
.chip.mine{border:1px dashed var(--dim)}
.screen-sub{margin-top:10px;font-size:13px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.trow .tl{flex:1;font-weight:600;font-size:14px}
.trow .stepper{flex:0 0 190px}
.trow .stepper button{width:44px;height:44px}
.trow .stepper .inp{height:44px;font-size:18px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.ko{background:var(--ko-soft);color:var(--ko)}
.tag.inj{background:var(--inj-soft);color:var(--inj)}
.days{display:flex;gap:6px;margin-top:14px}
.day{flex:1;height:38px;border-radius:11px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.today{outline:1.5px solid var(--dim)}
.day[disabled]{opacity:.35}

/* journal */
.entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .e-emoji{font-size:18px;width:28px;text-align:center}
.entry .e-main{flex:1;min-width:0}
.entry .e-title{font-weight:600;font-size:14.5px}
.entry .e-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{font-size:12.5px;color:var(--dim);padding:8px 4px;font-weight:600}
.del.confirm{color:var(--ko)}
.card{background:var(--surface);border-radius:var(--r);padding:4px 16px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border-radius:var(--r);font-size:14px}

/* history */
.hist-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.week-row{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.week-row summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
.week-row summary::-webkit-details-marker{display:none}
.week-row .wr-label{flex:1;font-weight:600}
.week-row .wr-label small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.wr-detail{padding:0 16px 14px}
.wr-goal{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.wr-goal span:last-child{color:var(--muted)}

/* goals list */
.gl-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 14px;margin-bottom:10px}
.gl-item .g-title{cursor:pointer}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:32px;height:22px;border-radius:7px;background:var(--surface2);color:var(--muted);font-size:11px}
.mv button[disabled]{opacity:.25}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:700;font-size:15.5px;background:var(--accent);color:var(--accent-ink)}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px dashed var(--line)}
.btn.quiet{background:var(--surface2);color:var(--text)}
.btn.danger{background:none;color:var(--ko);height:44px;font-weight:600}
.btn.danger.confirm{background:var(--ko-soft)}

/* profile */
.prof-head{display:flex;align-items:center;gap:16px;margin:16px 0 8px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:Archivo;font-weight:900;font-size:34px;color:var(--accent);overflow:hidden;flex:none;border:2px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof-head .pn{font-family:Archivo;font-weight:800;font-size:26px;letter-spacing:-.02em}
.edit-link{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px}
.stat .v{font-family:Archivo;font-weight:800;font-size:26px;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:500}
.stat.hl .v{color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border-radius:16px;padding:14px 8px 12px;text-align:center;width:100%;display:block}
.badge .b-e{font-size:28px;line-height:1.1}
.badge .b-n{font-weight:700;font-size:12.5px;margin-top:6px}
.badge .b-d{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.3}
.badge.locked .b-e{filter:grayscale(1);opacity:.28}
.badge.locked .b-n{color:var(--dim)}
.badge.got{box-shadow:inset 0 0 0 1.5px var(--tier)}
.badge .b-t{font-size:11.5px;font-weight:700;margin-top:3px;color:var(--tier,var(--dim));text-transform:uppercase;letter-spacing:.05em}
.badge .b-bar{height:4px;border-radius:4px;background:var(--surface2);margin:8px 6px 0;overflow:hidden}
.badge .b-bar i{display:block;height:100%;background:var(--tier,var(--dim))}
.foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:28px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,13,15,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b));display:flex;justify-content:center;z-index:10}
nav[hidden]{display:none}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--text)}
nav button.on svg{stroke:var(--accent)}

/* sheet */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#overlay.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:92vh;overflow-y:auto}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sh-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sh-title .t{font-family:Archivo;font-weight:800;font-size:21px;letter-spacing:-.01em}
.field{margin-bottom:16px}
.field label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;height:50px;border-radius:14px;background:var(--surface2);border:1.5px solid transparent;padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.big{height:64px;font-family:Archivo;font-weight:800;font-size:28px;text-align:center}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.chip.date{min-width:44px;padding:0 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;font-size:11px}
.chip.date b{font-size:15px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.ptabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:14px;margin:8px 0 6px}
.ptabs button{flex:1;height:38px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.ptabs button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.add.is-done{background:var(--surface2)!important}
.add.is-done svg{stroke:var(--accent)!important}
.seg button{min-height:46px;border-radius:13px;background:var(--surface2);font-weight:600;font-size:13.5px;color:var(--muted);padding:6px}
.seg button.on{background:var(--text);color:var(--bg)}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.75}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--surface2);font-size:24px;font-weight:600}
.stepper .inp{text-align:center;font-family:Archivo;font-weight:800;font-size:22px}
.emojis{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.emojis button{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--surface2);flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border-radius:14px;padding:14px}
.switch .k{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch.on .k{background:var(--inj)}
.switch.fin.on .k{background:var(--accent)}
.switch.on .k::after{transform:translateX(20px)}
.switch .s-t{font-weight:600}
.switch .s-d{font-size:12.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.recap-hero{text-align:center;padding:8px 0 14px}
.recap-hero .big{font-size:56px}
.recap-hero .t{font-family:Archivo;font-weight:900;font-size:28px;letter-spacing:-.02em;margin-top:6px}
.recap-hero.ok .t{color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* onboarding / loading */
.onb{min-height:80vh;display:flex;flex-direction:column;justify-content:center;padding-top:20px}
.onb .logo{font-family:Archivo;font-weight:900;font-size:44px;letter-spacing:-.04em;line-height:1}
.onb .logo span{color:var(--accent)}
.onb p{color:var(--muted);font-size:16px;margin:10px 0 30px}
.onb .defaults{background:var(--surface);border-radius:var(--r);padding:6px 16px;margin:6px 0 22px}
.onb .defaults div{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.onb .defaults div:last-child{border:0}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);text-align:center}
.pulse{width:14px;height:14px;background:var(--accent);border-radius:4px;transform:rotate(45deg);animation:p 1s infinite alternate;margin:0 auto 14px}
@keyframes p{to{opacity:.25;transform:rotate(225deg)}}

/* connexion */
.auth{justify-content:flex-start;padding-top:8vh}
.btn.google{background:#fff;color:#1f1f1f;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link-btn{color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.auth-switch{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
.auth-msg{font-size:13.5px;margin:-4px 0 14px;color:var(--accent)}
.auth-msg.ko{color:var(--ko)}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="pulse"></div>Chargement…</div></div></div>
<nav id="nav" hidden><div class="in">
  <button data-act="tab" data-tab="resolutions"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Résolutions</button>
  <button data-act="tab" data-tab="historique"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4h4M12 7.5V12l3 2"/></svg>Historique</button>
  <button data-act="tab" data-tab="objectifs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Objectifs</button>
  <button data-act="tab" data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-4 4-5.8 7.5-5.8s6.3 1.8 7.5 5.8"/></svg>Profil</button>
</div></nav>
<div id="overlay" data-act="close-sheet"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ============ utils ============ */
const $ = s => document.querySelector(s);
const CAP = window.Capacitor;
const IS_APP = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const _plugins = {};
const plugin = n => _plugins[n] || (_plugins[n] = (CAP.Plugins && CAP.Plugins[n]) || CAP.registerPlugin(n));
let APP_VERSION = '';
const LOCAL_KEY = 'resolio-v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey = k => { const [a,b,c] = k.split('-').map(Number); return new Date(a, b-1, c); };
const addDays = (k, n) => { const d = pkey(k); d.setDate(d.getDate()+n); return dkey(d); };
const mondayKey = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6) % 7)); return dkey(x); };
const curWeek = () => mondayKey();
const todayKey = () => dkey(new Date());
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONTHS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS = ['L','M','M','J','V','S','D'];
const DAYS_L = ['Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.','Dim.'];
function weekLabel(k, withYear) {
  const a = pkey(k), b = pkey(addDays(k, 6));
  const y = withYear && b.getFullYear() !== new Date().getFullYear() ? ' ' + b.getFullYear() : '';
  if (a.getMonth() === b.getMonth()) return `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]}${y}`;
  return `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}${y}`;
}
const fmt = n => { n = Math.round((+n || 0) * 10) / 10; return n.toLocaleString('fr-FR'); };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============ configuration & serveur (Supabase) ============
 * L'app lit et écrit directement dans la base Supabase : rien n'est stocké sur le téléphone,
 * à part la session de connexion. Toutes les écritures passent par write() (file d'attente).
 */
const CFG = window.RESOLIO_CONFIG || {};
const APP_SCHEME = 'com.quentinfayolle.resolio';
function redirectUrl(kind) {
  if (IS_APP) return `${APP_SCHEME}://${kind === 'reset' ? 'reset-password' : 'auth-callback'}`;
  return location.origin + location.pathname + (kind === 'reset' ? '?reset=1' : '');
}

// Conversions ligne de la base <-> objet de l'app
const profileFromRow = (r, user) => ({
  firstName: r.first_name || '', lastName: r.last_name || '', name: r.first_name || '',
  photo: r.avatar_url || null, birthDate: r.birth_date || '', city: r.city || '',
  startWeek: r.start_week || null, recaps: r.recaps || {}, createdAt: Date.parse(r.created_at) || Date.now(),
  email: (user && user.email) || ''
});
const profileToRow = p => ({
  first_name: (p.firstName || '').trim(), last_name: (p.lastName || '').trim(), avatar_url: p.photo || null,
  birth_date: p.birthDate || null, city: (p.city || '').trim() || null, start_week: p.startWeek || null,
  recaps: p.recaps || {}
});
const goalFromRow = r => ({
  id: r.id, period: r.period || 'week', metrics: Array.isArray(r.metrics) && r.metrics.length ? r.metrics : undefined,
  subtype: r.subtype || null, isLimit: !!r.is_limit, name: r.name, emoji: r.emoji || '🎯', cat: r.cat, type: r.type, unit: r.unit || '',
  activities: r.activities || [], distance: !!r.distance, createdWeek: r.created_week, archivedWeek: r.archived_week || null,
  position: r.position || 0, targetHistory: r.target_history || [], injuries: r.injuries || []
});
const goalToRow = (g, uid) => ({
  id: g.id, user_id: uid, period: periodOf(g), metrics: metricsOf(g), subtype: g.subtype || null, is_limit: isLimit(g), name: g.name, emoji: g.emoji || '🎯', cat: g.cat || 'other', type: g.type || 'count', unit: g.unit || '',
  activities: g.activities || [], distance: !!g.distance, created_week: g.createdWeek, archived_week: g.archivedWeek || null,
  position: g.position || 0, target_history: g.targetHistory || [], injuries: g.injuries || []
});
const weekToRow = (k, d, uid) => ({ user_id: uid, week: k, closed: !!d.closed, result: d.result || null, recap_seen: !!d.recapSeen });
const entryToRow = (e, k, uid) => ({
  id: e.id, user_id: uid, goal_id: e.goalId, week: k, date: e.date, cat: e.cat || 'other', amount: num(e.amount) || 0,
  book: e.book || null, book_finished: !!e.finished, activity: e.activity || null, duration: e.duration || null, distance: e.distance || null,
  note: e.note || null, at: Math.round(e.at || 0)
});
function entryFromRow(r) {
  const e = { id: r.id, goalId: r.goal_id, cat: r.cat, date: r.date, amount: num(r.amount), at: Number(r.at) || 0 };
  if (r.book) e.book = r.book;
  if (r.book_finished) e.finished = true;
  if (r.activity) e.activity = r.activity;
  if (r.duration) e.duration = num(r.duration);
  if (r.distance) e.distance = num(r.distance);
  if (r.note) e.note = r.note;
  return e;
}

// Liste des sports : la liste commune + les sports ajoutés par l'utilisateur (mine: true)
const mergeSports = (common, mine) => [...(common || []).map(x => ({ name: x.name, kind: x.kind, mine: false })), ...(mine || []).map(x => ({ name: x.name, kind: x.kind, mine: true }))]
  .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
function createSupabaseBackend() {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase) return null;
  const storage = IS_APP ? {
    getItem: k => plugin('Preferences').get({ key: k }).then(r => r.value),
    setItem: (k, v) => plugin('Preferences').set({ key: k, value: v }),
    removeItem: k => plugin('Preferences').remove({ key: k }),
  } : window.localStorage;
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
    auth: { storage, flowType: 'pkce', detectSessionInUrl: !IS_APP, persistSession: true, autoRefreshToken: true }
  });
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  const fetchAll = async (table, order) => {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const rows = chk(await sb.from(table).select('*').order(order).range(from, from + 999));
      out.push(...rows);
      if (rows.length < 1000) return out;
    }
  };
  const chunks = (arr, n = 500) => { const r = []; for (let i = 0; i < arr.length; i += n) r.push(arr.slice(i, i + n)); return r; };
  const providers = u => (u && u.app_metadata && u.app_metadata.providers) || [];
  return {
    // ----- connexion -----
    async getUser() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    onAuth(cb) { sb.auth.onAuthStateChange((event, session) => setTimeout(() => cb(event, session ? session.user : null), 0)); },
    hasPassword: u => providers(u).includes('email'),
    usesGoogle: u => providers(u).includes('google'),
    async signIn(email, password) { chk(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, firstName, lastName) {
      const d = chk(await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectUrl('auth'), data: { first_name: firstName, last_name: lastName } } }));
      if (d.user && Array.isArray(d.user.identities) && d.user.identities.length === 0) { const e = new Error('User already registered'); e.code = 'user_already_exists'; throw e; }
      return { needsConfirm: !d.session };
    },
    async signInGoogle() {
      if (IS_APP) {
        const d = chk(await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl('auth'), skipBrowserRedirect: true } }));
        await plugin('Browser').open({ url: d.url });
      } else {
        chk(await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl('auth') } }));
      }
    },
    // Retour d'un lien (Google, email de confirmation, mot de passe oublié) : com.quentinfayolle.resolio://...?code=...
    async handleDeepLink(url) {
      if (!url || !url.startsWith(APP_SCHEME + '://')) return null;
      try { await plugin('Browser').close(); } catch (e) {}
      const q = new URL(url.replace(APP_SCHEME + '://', 'https://app/'));
      const params = new URLSearchParams((q.search || '').slice(1) + '&' + (q.hash || '').slice(1));
      if (params.get('error_description')) throw new Error(params.get('error_description'));
      const code = params.get('code');
      if (!code) return null;
      chk(await sb.auth.exchangeCodeForSession(code));
      return url.includes('reset-password') ? 'reset' : 'auth';
    },
    async resetPassword(email) { chk(await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl('reset') })); },
    async updatePassword(password) { chk(await sb.auth.updateUser({ password })); },
    async signOut() { await sb.auth.signOut({ scope: 'local' }); },
    async deleteAccount(uid) {
      const files = (await sb.storage.from('avatars').list(uid)).data || [];
      if (files.length) await sb.storage.from('avatars').remove(files.map(f => `${uid}/${f.name}`));
      chk(await sb.rpc('delete_my_account'));
      await sb.auth.signOut({ scope: 'local' });
    },
    // ----- données -----
    async loadAll(user) {
      const uid = user.id;
      const [prow, goals, weeks, entries, sports, mySports] = await Promise.all([
        sb.from('profiles').select('*').eq('id', uid).maybeSingle().then(chk),
        fetchAll('goals', 'position'), fetchAll('weeks', 'week'), fetchAll('entries', 'at'),
        sb.from('sports').select('name,kind').order('name').then(chk),
        sb.from('user_sports').select('name,kind').order('name').then(chk),
      ]);
      const out = { profile: profileFromRow(prow || {}, user), goals: goals.map(goalFromRow), weeks: {}, sports: mergeSports(sports, mySports), screen: {} };
      // temps d'écran des 400 derniers jours
      const since = addDays(todayKey(), -400);
      for (let from = 0; ; from += 1000) {
        const rows = chk(await sb.from('screen_time').select('date,package,app_name,category,minutes').gte('date', since).order('date').range(from, from + 999));
        for (const r of rows) (out.screen[r.date] || (out.screen[r.date] = [])).push({ package: r.package, name: r.app_name || r.package, category: r.category || 'other', minutes: num(r.minutes) });
        if (rows.length < 1000) break;
      }
      for (const w of weeks) out.weeks[w.week] = { week: w.week, closed: w.closed, result: w.result || undefined, recapSeen: w.recap_seen, entries: [] };
      for (const r of entries) {
        const w = out.weeks[r.week] || (out.weeks[r.week] = { week: r.week, closed: false, entries: [] });
        w.entries.push(entryFromRow(r));
      }
      if (!prow) chk(await sb.from('profiles').upsert({ id: uid }));
      return out;
    },
    async saveProfile(uid, p) { chk(await sb.from('profiles').update(profileToRow(p)).eq('id', uid)); },
    async upsertScreenTime(rows) { for (const c of chunks(rows)) chk(await sb.from('screen_time').upsert(c, { onConflict: 'user_id,date,package' })); },
    async addUserSport(name, kind) { chk(await sb.from('user_sports').insert({ name, kind })); },
    async uploadAvatar(uid, blob) {
      const path = `${uid}/avatar-${Date.now()}.jpg`;
      chk(await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true }));
      const old = ((await sb.storage.from('avatars').list(uid)).data || []).map(f => `${uid}/${f.name}`).filter(n => n !== path);
      if (old.length) await sb.storage.from('avatars').remove(old);
      return sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    },
    async upsertGoals(rows) { if (rows.length) chk(await sb.from('goals').upsert(rows)); },
    async upsertWeeks(rows) { for (const c of chunks(rows)) chk(await sb.from('weeks').upsert(c, { onConflict: 'user_id,week' })); },
    async insertEntries(rows) { for (const c of chunks(rows)) chk(await sb.from('entries').insert(c)); },
    async deleteEntries(ids) { if (ids.length) chk(await sb.from('entries').delete().in('id', ids)); },
    async replaceAllData(uid, goals, weeks, entries) {
      chk(await sb.from('goals').delete().eq('user_id', uid));      // efface aussi les enregistrements (cascade)
      chk(await sb.from('weeks').delete().eq('user_id', uid));
      for (const c of chunks(goals)) chk(await sb.from('goals').insert(c));
      for (const c of chunks(weeks)) chk(await sb.from('weeks').insert(c));
      for (const c of chunks(entries)) chk(await sb.from('entries').insert(c));
    },
  };
}

/* ============ state ============ */
// phase : 'loading' | 'config' (Supabase non configuré) | 'auth' (pas connecté) | 'offline' | 'setup' (compte sans objectifs) | 'app'
const state = { phase: 'loading', user: null, profile: null, goals: null, weeks: {}, screen: {}, screenPerm: null, sports: [], loadErr: '', legacy: null };
let backend = null;
const TABS = ['resolutions', 'historique', 'objectifs', 'profil'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'resolutions';
let lastWeekSeen = todayKey();
const uid = () => state.user && state.user.id;

// File d'attente des écritures : une à la fois, dans l'ordre. En cas d'échec, on recharge depuis la base.
let writeChain = Promise.resolve(), pendingWrites = 0;
function write(fn) {
  pendingWrites++;
  writeChain = writeChain.then(fn).catch(async e => {
    console.error(e);
    toast(navigator.onLine === false ? 'Pas de connexion : modification non enregistrée' : 'Erreur : modification non enregistrée');
    await reloadData(true);
  }).finally(() => { pendingWrites--; });
  return writeChain;
}

const saveGoals = items => {
  items.forEach((g, i) => { g.position = i; });
  state.goals = items; render();
  const u = uid(); return write(() => backend.upsertGoals(items.map(g => goalToRow(g, u))));
};
const saveWeek = (k, doc) => {
  const old = state.weeks[k] || { entries: [] };
  state.weeks[k] = doc; render();
  const before = new Set((old.entries || []).map(e => e.id)), after = new Set((doc.entries || []).map(e => e.id));
  const added = (doc.entries || []).filter(e => !before.has(e.id)), removed = [...before].filter(id => !after.has(id));
  const u = uid();
  return write(async () => {
    await backend.upsertWeeks([weekToRow(k, doc, u)]);
    if (added.length) await backend.insertEntries(added.map(e => entryToRow(e, k, u)));
    if (removed.length) await backend.deleteEntries(removed);
  });
};
const saveProfile = p => { state.profile = p; render(); const u = uid(); return write(() => backend.saveProfile(u, p)); };
const weekDoc = k => state.weeks[k] || { week: k, entries: [], closed: false };
const goalsList = () => state.goals || [];
const goalById = id => goalsList().find(g => g.id === id);

async function loadData() {
  if (!state.user) return;
  state.phase = 'loading'; state.loadErr = ''; render();
  try {
    const d = await backend.loadAll(state.user);
    Object.assign(state, { profile: d.profile, goals: d.goals, weeks: d.weeks, sports: d.sports || [], screen: d.screen || {} });
    state.phase = d.profile.startWeek ? 'app' : 'setup';
    if (state.phase === 'app') await withTimeout(syncScreenTime(), 8000);   // avant les bilans : le temps d'écran d'hier doit être à jour
    if (state.phase === 'setup') state.legacy = await readLegacyData();
  } catch (e) {
    console.error(e);
    state.phase = 'offline'; state.loadErr = errText(e);
  }
  render(); maintenance();
}
// Recharge sans écran de chargement (retour dans l'app, ou après une erreur d'écriture)
async function reloadData(force) {
  if (!state.user || (!force && pendingWrites) || !['app', 'offline'].includes(state.phase)) return;
  try {
    const d = await backend.loadAll(state.user);
    if (!force && pendingWrites) return;
    Object.assign(state, { profile: d.profile, goals: d.goals, weeks: d.weeks, sports: d.sports || state.sports || [], screen: Object.assign({}, d.screen || {}, state.screen || {}) });
    await withTimeout(syncScreenTime(), 8000);
    if (state.phase === 'offline') state.phase = d.profile.startWeek ? 'app' : 'setup';
    render(); maintenance();
  } catch (e) { /* hors ligne : on garde l'affichage actuel */ }
}

// Données de l'ancienne version (stockées sur le téléphone) : proposées à l'import une seule fois
async function readLegacyData() {
  try {
    const raw = IS_APP ? (await plugin('Preferences').get({ key: LOCAL_KEY })).value : localStorage.getItem(LOCAL_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && d.goals && d.goals.items && d.goals.items.length ? d : null;
  } catch (e) { return null; }
}
async function forgetLegacyData() {
  state.legacy = null;
  try { if (IS_APP) await plugin('Preferences').remove({ key: LOCAL_KEY }); else localStorage.removeItem(LOCAL_KEY); } catch (e) {}
}

function errText(e) {
  const code = (e && (e.code || e.error_code)) || '', msg = String((e && e.message) || e || '');
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if (code === 'email_not_confirmed' || /email not confirmed/i.test(msg)) return 'Confirme d\'abord ton email : clique sur le lien reçu (pense aux spams).';
  if (code === 'user_already_exists' || /already registered/i.test(msg)) return 'Un compte existe déjà avec cet email. Connecte-toi.';
  if (code === 'weak_password' || /password should be/i.test(msg)) return 'Mot de passe trop faible : 8 caractères minimum.';
  if (/rate limit|over_email_send/i.test(code + msg)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if (code === 'same_password') return 'Choisis un mot de passe différent de l\'ancien.';
  if (/failed to fetch|network|load failed/i.test(msg) || navigator.onLine === false) return 'Pas de connexion internet.';
  return msg || 'Une erreur est survenue.';
}

/* ---- temps d'écran : lu sur le téléphone (module Android ScreenTime), enregistré dans la base ---- */
const screenPlugin = () => window.__SCREEN_TIME_TEST__ || (IS_APP ? plugin('ScreenTime') : null);
const hasScreenGoals = () => goalsList().some(g => g.cat === 'screen' && !isArchived(g));
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
let screenSyncing = null;
function syncScreenTime(force) {
  if (screenSyncing) return screenSyncing;
  screenSyncing = (async () => {
    const sp = screenPlugin();
    if (!sp || !state.user || (!force && !hasScreenGoals())) return;
    try {
      const { granted } = await sp.hasPermission();
      state.screenPerm = !!granted;
      if (!granted) return;
      // jours à relire : depuis le dernier jour connu (au moins 2 : hier peut avoir changé), 31 au premier passage
      const known = Object.keys(state.screen || {}).filter(d => (state.screen[d] || []).length).sort();
      const last = known[known.length - 1];
      const days = last ? Math.min(31, Math.max(2, Math.round((pkey(todayKey()) - pkey(last)) / 864e5) + 1)) : 31;
      const r = await sp.getDailyUsage({ days });
      const rows = [], u = uid();
      state.screen = state.screen || {};
      for (const d of (r.days || [])) {
        if (!d.apps.length && (state.screen[d.date] || []).length) continue;   // le téléphone a oublié ce jour : on garde ce qu'on avait
        state.screen[d.date] = d.apps.map(a => ({ package: a.package, name: a.name, category: a.category || 'other', minutes: num(a.minutes) }));
        for (const a of d.apps) rows.push({ user_id: u, date: d.date, package: a.package, app_name: a.name, category: a.category || 'other', minutes: Math.min(1440, num(a.minutes)) });
      }
      if (rows.length) await write(() => backend.upsertScreenTime(rows));
    } catch (e) { console.error('temps d\'écran', e); }
  })().finally(() => { screenSyncing = null; });
  return screenSyncing;
}

/* ---- import d'une sauvegarde / des données de l'ancienne version dans le compte ---- */
async function importIntoAccount(d) {
  const u = uid(), goals = (d.goals && d.goals.items) || [];
  const ids = new Set(goals.map(g => g.id));
  const weeks = [], entries = [];
  for (const [k, w] of Object.entries(d.weeks || {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || pkey(k).getDay() !== 1) continue;
    weeks.push(weekToRow(k, w, u));
    for (const e of (w.entries || [])) if (ids.has(e.goalId) && e.date >= k && e.date < addDays(k, 7)) entries.push(entryToRow(e, k, u));
  }
  await backend.replaceAllData(u, goals.map((g, i) => goalToRow(Object.assign({}, g, { position: i }), u)), weeks, entries);
  const p = clone(state.profile);
  const old = d.profile || {};
  if (!p.firstName && old.name) p.firstName = old.name;
  if (!p.firstName && old.firstName) { p.firstName = old.firstName; p.lastName = p.lastName || old.lastName || ''; }
  p.startWeek = old.startWeek || p.startWeek || curWeek();
  if (old.photo && /^data:image/.test(old.photo) && !p.photo) {
    try { p.photo = await backend.uploadAvatar(u, await (await fetch(old.photo)).blob()); } catch (e) {}
  } else if (old.photo && /^https?:/.test(old.photo) && !p.photo) p.photo = old.photo;
  await backend.saveProfile(u, p);
}

  openSheet(`<div class="sh-title"><div class="emoji">${b.e}</div><div><div class="t">${b.n}</div><div class="muted" style="font-size:13px">${esc(b.cat)} · ${fmt(L.v)} ${esc(b.u)}</div></div></div>
    <div class="card" style="padding:4px 16px;margin-bottom:16px">` + TIERS.map((t, k) => {
      const ok = L.lvl > k;
      return `<div class="entry"><div class="e-emoji">${t.e}</div><div class="e-main"><div class="e-title" style="color:${ok ? t.c : 'var(--muted)'}">${t.n}</div><div class="e-sub">${fmt(b.steps[k])} ${esc(b.u)}</div></div>${ok ? '<span class="tag ok">✓</span>' : L.lvl === k ? `<span class="tag">${fmt(Math.max(0, b.steps[k] - L.v))} à faire</span>` : ''}</div>`;
    }).join('') + `</div><button class="btn quiet" data-act="close-sheet">Fermer</button>`);
}

/* ============ render ============ */
const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function ring(p) {
  const r = 26, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 64 64" class="ring"><circle cx="32" cy="32" r="${r}" class="ring-bg"/><circle cx="32" cy="32" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - Math.min(1, p))).toFixed(1)}" transform="rotate(-90 32 32)"/></svg>`;
}
function brand() {
  return `<div class="brand"><span class="dot"></span>Resolio<span class="sync">${navigator.onLine === false ? 'Hors ligne' : ''}</span></div>`;
}
function render() {
  const app = $('#app');
  const full = html => { $('#nav').hidden = true; app.innerHTML = html; };
  if (state.phase === 'loading') return full(`<div class="loading"><div><div class="pulse"></div>Chargement…</div></div>`);
  if (state.phase === 'config') return full(`<div class="onb"><div class="logo">Resoli<span>o</span></div><p>L'application n'est pas encore reliée à sa base de données.</p><div class="hint">Renseigne l'adresse et la clé Supabase dans <b>www/config.js</b> (voir supabase/README.md).</div></div>`);
  if (state.phase === 'auth') return full(viewAuth());
  if (state.phase === 'offline') return full(`<div class="onb"><div style="font-size:48px">📡</div><h1 style="font-size:26px">Impossible de joindre Resolio</h1>
    <p>${esc(state.loadErr || 'Vérifie ta connexion internet.')}</p><button class="btn" data-act="retry">Réessayer</button>
    <button class="link-btn" data-act="logout" style="display:block;margin:20px auto 0">Se déconnecter</button></div>`);
  if (state.phase === 'setup') return full(viewSetup());
  $('#nav').hidden = false;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const v = { resolutions: viewResolutions, historique: viewHistory, objectifs: viewGoals, profil: viewProfile }[tab];
  app.innerHTML = brand() + v();
}

function goalMeta(g, r) {
  const ms = r.metrics || [];
  if (metricsOf(g)[0] === 'once') return (r.done ? 'Fait ' : 'À faire ') + P[periodOf(g)].now;
  if (ms.length > 1) {   // plusieurs mesures : le détail est sur les barres
    const sub = g.cat === 'sport' ? [g.subtype && g.subtype !== 'any' ? SPORT_TYPES[g.subtype] : '', (g.activities || []).slice(0, 3).join(', ')].filter(Boolean).join(' · ') : '';
    if (g.cat === 'reading') { const b = lastBookOf(g.id); if (b) return '« ' + esc(b) + ' »'; }
    return sub ? esc(sub) : '';
  }
  const x = ms[0];
  const [a, b] = fmtPair(x.done, x.target, x.unit).split(' / ');
  return `<b>${esc(a)}</b> / ${esc(b)}${x.m === 'limit' ? ' max' : ''}`;
}
function metricBars(r, dots) {
  const ms = (r.metrics || []).filter(x => x.m !== 'once' && !(dots && x.m === 'days'));
  if (!ms.length) return '';
  const bar = x => {
    const pct = Math.min(100, x.target ? x.done / x.target * 100 : (x.done ? 100 : 0));
    const cls = x.m === 'limit' ? (x.done > x.target ? 'over' : 'lim') : x.done >= x.target ? 'full' : '';
    return `<div class="bar ${ms.length > 1 ? 'sm' : ''} ${cls}"><i style="width:${pct}%"></i></div>`;
  };
  if (ms.length === 1) return bar(ms[0]);
  return `<div class="mbars">` + ms.map(x => `<div class="mrow"><span>${esc(fmtPair(x.done, x.target, x.unit))}</span>${bar(x)}</div>`).join('') + `</div>`;
}
let period = 'week';
function viewResolutions() {
  const avail = activePeriods();
  if (!avail.length) return `<div class="eyebrow">Résolutions</div><h1>Rien en cours</h1>
    <div class="empty" style="margin-top:18px">Tu n'as aucune résolution active.<br><br><button class="btn" data-act="new-goal">Ajouter une résolution</button></div>`;
  if (!avail.includes(period)) period = avail.includes('week') ? 'week' : avail[0];
  const p = period, start = periodStart(p), next = periodNext(p, start), today = todayKey();
  const entries = entriesBetween(start, next), res = computePeriod(p, start, entries);
  let h = avail.length > 1 ? `<div class="ptabs">${avail.map(x => `<button class="${x === p ? 'on' : ''}" data-act="period" data-val="${x}">${P[x].tab}</button>`).join('')}</div>` : '';
  const counted = res.goals.filter(x => x.status !== 'injured'), ok = counted.filter(x => x.status === 'ok').length;
  const left = daysLeft(p);
  const leftTxt = p === 'day' ? "Jusqu'à minuit" : left === 1 ? 'Dernier jour, fonce !' : `Encore ${left} jours`;
  h += `<div class="eyebrow">${P[p].eyebrow}</div><h1>${periodTitle(p, start)}</h1>`;
  h += `<div class="summary">${ring(counted.length ? ok / counted.length : 0)}<div><b>${ok} / ${counted.length}</b> <span class="muted">résolution${counted.length > 1 ? 's tenues' : ' tenue'}</span><div class="muted" style="font-size:13.5px">${leftTxt}</div></div></div>`;
  if (res.validated && res.goals.some(x => !x.limit)) h += `<div class="validated-banner">🔥 ${P[p].validated}. Bien joué ${esc(state.profile.name)} !</div>`;
  for (const g of goalsList().filter(g => periodOf(g) === p && isActive(g, start))) {
    const r = res.goals.find(x => x.id === g.id), ms = metricsOf(g), lim = isLimit(g);
    const inj = r.status === 'injured', done = r.status === 'ok' && !lim;
    const dailyOnly = ms.length === 1 && ms[0] === 'days';
    const dots = dailyOnly && p === 'week';
    const doneToday = dailyOnly && entries.some(e => e.goalId === g.id && e.date === today);
    let tags = '';
    if (inj) tags = `<span class="tag inj">🩹 Blessure · ne compte pas</span>`;
    else if (done) tags = `<span class="tag ok">Atteint</span>`;
    else if (lim && r.status === 'ko') tags = `<span class="tag ko">Limite dépassée</span>`;
    let btn = '', extra = '';
    if (g.cat === 'screen') {
      const top = screenTopApps(g, start, next);
      extra = `<div class="screen-sub">${top.length ? top.map(([n, m]) => `${esc(n)} ${hm(m)}`).join(' · ') : 'Aucune utilisation enregistrée pour l’instant'}</div>`;
      if (!screenPlugin()) extra += `<div class="hint">Le temps d'écran se lit dans l'application Android.</div>`;
      else if (state.screenPerm === false) extra += `<button class="btn quiet" style="height:44px;margin-top:10px;font-size:14px" data-act="screen-perm">Autoriser l'accès au temps d'écran</button>`;
    } else if (!inj && !dots) {
      if (dailyOnly) btn = `<button class="add ${doneToday ? 'is-done' : ''}" data-act="toggle-day" data-id="${g.id}" data-date="${today}" aria-label="Fait aujourd'hui">${doneToday ? ICON_CHECK : ICON_PLUS}</button>`;
      else btn = `<button class="add ${done && ms[0] === 'once' ? 'is-done' : ''} ${lim ? 'neutral' : ''}" data-act="add" data-id="${g.id}" aria-label="Ajouter">${done && ms[0] === 'once' ? ICON_CHECK : ICON_PLUS}</button>`;
    }
    h += `<div class="goal ${done ? 'done' : ''} ${inj ? 'injured' : ''}">
      <div class="g-top"><div class="emoji">${esc(g.emoji || '🎯')}</div>
        <div class="g-title"><div class="g-name">${esc(g.name)}</div><div class="g-meta">${goalMeta(g, r)}${dailyOnly && !dots ? ` · ${doneToday ? "fait aujourd'hui" : "pas encore aujourd'hui"}` : ''}</div></div>
        ${tags && !btn ? tags : ''}${btn}
      </div>`;
    if (dots) {
      const set = new Set(entries.filter(e => e.goalId === g.id).map(e => e.date));
      h += `<div class="days">` + DAYS.map((d, i) => {
        const dk = addDays(start, i), fut = dk > today;
        return `<button class="day ${set.has(dk) ? 'on' : ''} ${dk === today ? 'today' : ''}" ${fut || inj ? 'disabled' : ''} data-act="toggle-day" data-id="${g.id}" data-date="${dk}">${d}</button>`;
      }).join('') + `</div>`;
    } else h += metricBars(r, dots);
    h += extra;
    if (tags && btn) h += `<div style="margin-top:10px">${tags}</div>`;
    h += `</div>`;
  }
  const ids = new Set(res.goals.map(x => x.id));
  const journal = entries.filter(e => ids.has(e.goalId) && metricsOf(goalById(e.goalId))[0] !== 'days')
    .sort((a, b) => a.date === b.date ? (b.at || 0) - (a.at || 0) : a.date < b.date ? 1 : -1);
  h += `<h2>${P[p].journal}</h2>`;
  if (!journal.length) h += `<div class="empty">Rien pour l'instant. Appuie sur <b style="color:var(--accent)">+</b> pour enregistrer une séance, une lecture…</div>`;
  else h += `<div class="card">` + journal.slice(0, 60).map(e => entryRow(e)).join('') + `</div>` + (journal.length > 60 ? `<div class="hint" style="text-align:center;margin-top:8px">Les 60 derniers enregistrements sont affichés.</div>` : '');
  return h;
}
function entryDesc(e, g) {
  const parts = [], ms = metricsOf(g);
  if (ms.includes('pages') || ms.includes('quantity')) parts.push(`${fmt(e.amount)} ${ms.includes('pages') ? 'pages' : g.unit || ''}`.trim());
  if (ms.includes('limit')) parts.push(`${fmt(e.amount)} ${e.amount > 1 ? unitOf(g, 'limit') : (REDUCE_TYPES[g.subtype] || REDUCE_TYPES.alcohol).one}`);
  if (e.activity) parts.push(e.activity);
  if (e.book) parts.push('« ' + e.book + ' »' + (e.finished ? ' 📕 terminé' : ''));
  else if (e.finished) parts.push('📕 livre terminé');
  if (e.duration) parts.push(fmt(e.duration) + ' min');
  if (e.distance) parts.push(fmt(e.distance) + ' km');
  return parts;
}
let pendingDel = null, pendingDelT, logoutConfirm = false;
function entryRow(e) {
  const g = goalById(e.goalId);
  const parts = entryDesc(e, g);
  const dd = pkey(e.date), di = (dd.getDay() + 6) % 7;
  const dayLbl = period === 'week' || period === 'day' ? DAYS_L[di] + ' ' + dd.getDate() : dd.getDate() + ' ' + MONTHS[dd.getMonth()];
  const title = parts.length ? esc(parts[0]) : esc(g.name);
  const sub = [dayLbl, ...parts.slice(1).map(esc), e.note ? esc(e.note) : ''].filter(Boolean).join(' · ');
  return `<div class="entry"><div class="e-emoji">${esc(g.emoji || '🎯')}</div><div class="e-main"><div class="e-title">${title}${parts.length ? ` <span class="muted" style="font-weight:500">· ${esc(g.name)}</span>` : ''}</div><div class="e-sub">${sub}</div></div>
    <button class="del ${pendingDel === e.id ? 'confirm' : ''}" data-act="del-entry" data-id="${e.id}">${pendingDel === e.id ? 'Supprimer ?' : 'Retirer'}</button></div>`;
}

let histPeriod = 'week';
function viewHistory() {
  const avail = PERIODS.filter(p => goalsList().some(g => periodOf(g) === p));
  if (!avail.length) return `<div class="eyebrow">Rétrospective</div><h1>Historique</h1><div class="empty" style="margin-top:18px">Ajoute des résolutions pour voir ton historique ici.</div>`;
  if (!avail.includes(histPeriod)) histPeriod = avail.includes('week') ? 'week' : avail[0];
  const p = histPeriod, cur = periodStart(p);
  let h = avail.length > 1 ? `<div class="ptabs">${avail.map(x => `<button class="${x === p ? 'on' : ''}" data-act="hist-period" data-val="${x}">${P[x].tab}</button>`).join('')}</div>` : '';
  h += `<div class="eyebrow">Rétrospective</div><h1>${P[p].hist}</h1>`;
  const { list, valid, total, streak, best } = periodStats(p);
  h += `<div class="hist-stats"><div class="stat hl"><div class="v">${valid}<span class="muted" style="font-size:16px"> / ${total}</span></div><div class="l">${P[p].stat}</div></div><div class="stat"><div class="v">${streak}</div><div class="l">série en cours (record ${best})</div></div></div>`;
  h += `<h2>Historique</h2>`;
  if (!list.length) {
    const when = { day: 'demain', week: 'lundi prochain', month: 'le 1er du mois prochain', year: 'le 1er janvier' }[p];
    return h + `<div class="empty">Ton premier bilan arrivera ${when}.</div>`;
  }
  for (const { k, r } of list.slice(0, p === 'day' ? 90 : 120)) {
    const badge = r.exempt ? `<span class="tag inj">🩹 Pause</span>` : r.validated ? `<span class="tag ok">✓ ${P[p].ok}</span>` : `<span class="tag ko">✗ ${P[p].ko}</span>`;
    const sub = p === 'week' || p === 'day' ? `<small>${pkey(k).getFullYear()}</small>` : '';
    h += `<details class="week-row"><summary><div class="wr-label">${periodTitle(p, k, true)}${sub}</div>${badge}</summary><div class="wr-detail">` +
      r.goals.map(x => {
        const ic = x.status === 'ok' ? '✓' : x.status === 'injured' ? '🩹' : '✗';
        const val = resultText(x);
        return `<div class="wr-goal"><span>${ic} ${esc(x.emoji || '')} ${esc(x.name)}</span><span>${val}</span></div>`;
      }).join('') + `</div></details>`;
  }
  return h;
}

function screenScope(g) {
  const sel = g.activities || [];
  if (g.subtype === 'categories') return sel.map(c => APP_CATS[c] || c).join(', ') || 'catégories';
  if (g.subtype === 'apps') {
    const names = {};
    for (const apps of Object.values(state.screen || {})) for (const x of apps) names[x.package] = x.name;
    return sel.map(p => names[p] || p.split('.').pop()).join(', ') || 'applications';
  }
  return 'tout le téléphone';
}
function goalLine(g) {
  const t = curTargets(g), per = P[periodOf(g)].per, ms = metricsOf(g);
  if (ms[0] === 'once') return 'Une fois par ' + per;
  if (ms[0] === 'days') return `${t.days} jour${t.days > 1 ? 's' : ''} par ${per}`;
  if (g.cat === 'screen') return `Max ${hm(t.limit)} par ${per} · ${esc(screenScope(g))}`;
  if (ms[0] === 'limit') return `Max ${fmt(t.limit)} ${esc(unitOf(g, 'limit'))} par ${per}`;
  return ms.map(m => esc(fmtAmount(t[m], unitOf(g, m)))).join(' · ') + ' par ' + per;
}
function viewGoals() {
  const active = goalsList().filter(g => !isArchived(g)), archived = goalsList().filter(isArchived);
  let h = `<div class="eyebrow">Réglages</div><h1>Objectifs</h1>`;
  for (const p of PERIODS) {
    const list = active.filter(g => periodOf(g) === p);
    if (!list.length) continue;
    h += `<div class="lbl" style="margin:22px 0 10px">${P[p].tab}</div>`;
    list.forEach((g, i) => {
      h += `<div class="gl-item"><div class="emoji">${esc(g.emoji || '🎯')}</div>
        <div class="g-title" data-act="edit-goal" data-id="${g.id}"><div class="g-name">${esc(g.name)}</div><div class="g-meta">${goalLine(g)}${injuredNow(g) ? ' · <span style="color:var(--inj)">🩹 blessure</span>' : ''}</div></div>
        <div class="mv"><button data-act="move-goal" data-id="${g.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Monter">▲</button><button data-act="move-goal" data-id="${g.id}" data-dir="1" ${i === list.length - 1 ? 'disabled' : ''} aria-label="Descendre">▼</button></div></div>`;
    });
  }
  if (!active.length) h += `<div class="empty" style="margin-top:18px">Aucune résolution pour l'instant.</div>`;
  h += `<button class="btn ghost" data-act="new-goal" style="margin-top:16px">${ICON_PLUS.replace('<svg', '<svg width="20" height="20" stroke="currentColor"')} Nouvel objectif</button>`;
  h += `<div class="hint" style="margin-top:14px">Appuie sur un objectif pour changer son chiffre, le mettre en pause pour blessure ou l'archiver. Un changement de chiffre compte à partir de la période en cours : les périodes passées gardent leur ancien objectif.</div>`;
  if (archived.length) {
    h += `<h2>Archivés</h2>`;
    archived.forEach(g => {
      h += `<div class="gl-item" style="opacity:.7"><div class="emoji">${esc(g.emoji || '🎯')}</div><div class="g-title"><div class="g-name">${esc(g.name)}</div><div class="g-meta">${goalLine(g)}</div></div><button class="chip" data-act="restore-goal" data-id="${g.id}">Restaurer</button></div>`;
    });

  return h;

  h += `<h2>Séries</h2><div class="stats">

    <div class="stat"><div class="v">${hm(s.medMinutes)}</div><div class="l">de méditation</div></div></div>`;

function readEntryInputs() {

function saveEntry() {

  const e = { id: rid(), goalId: g.id, cat: g.cat || 'other', date: entryDraft.date, at: Date.now() };
  const ms = metricsOf(g);
  if (ms.includes('pages') || ms.includes('quantity') || ms.includes('limit')) {
    const a = num(v['en-amount']);
    if (a <= 0) { toast(ms.includes('pages') ? 'Indique le nombre de pages' : ms.includes('limit') ? 'Indique un nombre' : 'Indique ' + (g.unit ? 'le nombre de ' + g.unit : 'une quantité')); return; }
    e.amount = a;
  } else e.amount = g.cat === 'reading' ? 0 : 1;
  if (ms.includes('time') && !(num(v['en-dur']) > 0)) { toast('Indique la durée (en minutes)'); return; }
  if (ms.includes('distance') && !(num(v['en-dist']) > 0)) { toast('Indique la distance (en km)'); return; }

  if (v['en-note'] && v['en-note'].trim()) e.note = v['en-note'].trim();
  const p = periodOf(g), st = periodStart(p), nx = periodNext(p, st);
  const before = computePeriod(p, st, entriesBetween(st, nx)).goals.find(x => x.id === g.id);
  const wk = mondayKey(pkey(e.date)), doc = clone(weekDoc(wk));
  doc.entries.push(e); doc.week = wk;
  closeSheet(); saveWeek(wk, doc);
  const after = computePeriod(p, st, entriesBetween(st, nx));
  const ga = after.goals.find(x => x.id === g.id) || { metrics: [{ done: 0, target: 0 }] };
  if (isLimit(g)) {
    const x = ga.metrics[0], left = x.target - x.done;
    toast(left < 0 ? `⚠️ Limite dépassée (${fmt(x.done)} / ${fmt(x.target)})` : left === 0 ? 'Limite atteinte : on s\'arrête là 💪' : `Noté. Il t'en reste ${fmt(left)} au maximum`);
  }
  else if (after.validated && before && before.status !== 'ok') toast('🔥 ' + P[p].validated + ' !');
  else if (ga && ga.status === 'ok' && before && before.status !== 'ok') toast('✓ Objectif atteint !');
  else toast('Enregistré');
}
function toggleDay(id, date) {
  const wk = mondayKey(pkey(date)), doc = clone(weekDoc(wk));

  const g = goalById(id);
  if (has) doc.entries = doc.entries.filter(e => !(e.goalId === id && e.date === date));
  else doc.entries.push({ id: rid(), goalId: id, cat: g.cat || 'other', date, amount: 1, at: Date.now() });

function removeEntries(ids) {

const dailyMax = p => p === 'week' ? 7 : p === 'month' ? 31 : 0;   // « chaque jour » : x jours par semaine / par mois
function saveGoal() {
  readGoalForm();
  const d = goalDraft, cur = periodStart(d.period);
  if (!d.name.trim()) { toast('Donne un nom à ta résolution'); return; }
  if (d.cat === 'other' && d.type === 'daily' && !dailyMax(d.period)) d.type = 'count';
  const ms = draftMetrics(d);
  if (!ms.length) { toast('Choisis au moins une chose à suivre'); return; }
  if (d.cat === 'screen' && d.subtype !== 'total' && !d.activities.length) { toast(d.subtype === 'apps' ? 'Choisis au moins une application' : 'Choisis au moins une catégorie'); return; }
  const targets = {};
  for (const m of ms) {
    let t = m === 'once' ? 1 : num(d.targets[m] != null ? d.targets[m] : d.cat === 'screen' ? SCREEN_DEFAULT[d.period] : defaultTarget(m, d.period));
    if (m === 'days') t = Math.min(dailyMax(d.period), Math.max(1, Math.round(t)));
    else if (m === 'limit') t = Math.max(0, Math.round(t));
    else t = Math.max(m === 'time' || m === 'distance' ? 0.1 : 1, t);
    targets[m] = t;
  }
  const type = ms[0] === 'once' ? 'once' : ms[0] === 'days' ? 'daily' : ['pages', 'quantity', 'limit'].includes(ms[0]) ? 'quantity' : 'count';
  const fields = {
    name: d.name.trim(), emoji: (d.emoji || '🎯').trim() || '🎯', cat: d.cat, type, metrics: ms,
    subtype: ['sport', 'reduce', 'screen'].includes(d.cat) ? d.subtype : null, isLimit: d.cat === 'reduce' || d.cat === 'screen',
    unit: d.cat === 'other' ? (ms[0] === 'days' ? 'jours' : ms[0] === 'once' ? '' : (d.unit || '').trim()) : unitOf({ cat: d.cat, subtype: d.subtype, unit: '' }, ms[0]),
    activities: d.cat === 'sport' || (d.cat === 'screen' && d.subtype !== 'total') ? d.activities : [], distance: ms.includes('distance'),
  };
  const items = clone(goalsList());
  if (d._new) {
    items.push(Object.assign({ id: rid(), period: d.period, createdWeek: cur, archivedWeek: null, injuries: [], targetHistory: [{ from: cur, target: targets[ms[0]], targets }] }, fields));
    period = d.period;
  } else {
    const g = items.find(x => x.id === d.id), key = periodStart(periodOf(g));
    const changed = JSON.stringify(curTargets(g)) !== JSON.stringify(targets) || JSON.stringify(metricsOf(g)) !== JSON.stringify(ms);
    Object.assign(g, fields);
    if (changed) {
      g.targetHistory = (g.targetHistory || []).filter(x => x.from !== key);
      g.targetHistory.push({ from: key, target: targets[ms[0]], targets });
      g.targetHistory.sort((a, b) => a.from < b.from ? -1 : 1);
    }
  }
  closeSheet(); saveGoals(items); toast(d._new ? 'Résolution ajoutée' : 'Résolution mise à jour');
  if (d.cat === 'screen') syncScreenTime(true).then(render);
}
// applications vues dans le temps d'écran des 30 derniers jours, des plus utilisées aux moins utilisées
function knownApps() {
  const by = {}, since = addDays(todayKey(), -30);
  for (const [d, apps] of Object.entries(state.screen || {})) if (d >= since) for (const x of apps) {
    const a = by[x.package] || (by[x.package] = { package: x.package, name: x.name || x.package, minutes: 0 });
    a.minutes += num(x.minutes);
  }
  for (const p of (goalDraft && goalDraft.activities) || []) if (goalDraft.cat === 'screen' && !by[p] && !APP_CATS[p]) by[p] = { package: p, name: p.split('.').pop(), minutes: 0 };
  return Object.values(by).sort((a, b) => b.minutes - a.minutes).slice(0, 60);
}

function ageFrom(d) {
  if (!d) return 0;
  const b = new Date(d + 'T00:00:00'), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a > 0 && a < 130 ? a : 0;
}

function resizeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 320, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

    saveGoals(items);
  },
  'restore-goal': el => {
    const items = clone(goalsList()), g = items.find(x => x.id === el.dataset.id);
    g.archivedWeek = null; if (g.createdWeek > periodStart(periodOf(g))) g.createdWeek = periodStart(periodOf(g));
    saveGoals(items); toast('Objectif restauré');
  },
  'edit-profile': () => openProfileEditor(),
  'badge': el => openBadge(+el.dataset.i),
  'change-password': () => openPasswordSheet(false),
  'save-password': () => savePassword(),
  'delete-account': () => openDeleteAccount(),
  'confirm-delete-account': () => deleteAccount(),
  'logout': async () => { closeSheet(); await backend.signOut(); },
  'export': () => exportBackup(),
  'import': () => {
    openSheet(`<div class="sh-title"><div class="t">Restaurer</div></div>
      <div class="hint" style="margin:0 0 14px">Choisis le fichier de sauvegarde, ou colle son contenu. <b style="color:var(--ko)">Les données actuelles de ton compte seront remplacées.</b></div>
      <label class="btn quiet" style="margin-bottom:12px">Choisir un fichier<input type="file" id="imp-file" accept=".json,.txt,application/json,text/plain" hidden></label>
      <textarea class="inp" id="imp-text" style="height:140px;padding:12px;font-size:12px" placeholder="…ou colle la sauvegarde ici"></textarea>
      <button class="btn" data-act="do-import" style="margin-top:12px">Restaurer</button>`);
  },
  'do-import': () => doImport($('#imp-text').value),
  'remove-photo': () => { photoDraft = null; renderProfileEditor(); },
  'save-profile': () => saveProfileForm(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
async function exportBackup() {
  const data = JSON.stringify({ app: 'Resolio', v: 2, exportedAt: new Date().toISOString(), profile: state.profile, goals: { items: goalsList() }, weeks: state.weeks }, null, 1);
  const name = 'resolio-sauvegarde-' + todayKey() + '.json';
  if (IS_APP) {
    try {
      const w = await plugin('Filesystem').writeFile({ path: name, data, directory: 'CACHE', encoding: 'utf8' });
      await plugin('Share').share({ title: 'Sauvegarde Resolio', dialogTitle: 'Sauvegarder Resolio', files: [w.uri] });
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Export impossible'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
let importBusy = false;
async function doImport(txt) {
  if (importBusy) return;
  let d;
  try { d = JSON.parse(String(txt || '').trim()); } catch (e) { toast('Sauvegarde illisible'); return; }
  if (!d || !d.weeks || !d.goals || !Array.isArray(d.goals.items)) { toast('Ce n\'est pas une sauvegarde Resolio'); return; }
  importBusy = true; toast('Import en cours…');
  try { await importIntoAccount(d); closeSheet(); toast('Sauvegarde importée ✓'); await loadData(); }
  catch (e) { toast('Import impossible : ' + errText(e)); }
  importBusy = false;
}
document.addEventListener('change', async e => {
  if (e.target.id === 'imp-file' && e.target.files[0]) { try { doImport(await e.target.files[0].text()); } catch (err) { toast('Fichier illisible'); } return; }
  if (e.target.id === 'pe-photo' && e.target.files[0]) {
    try { photoDraft = await resizeImage(e.target.files[0]); renderProfileEditor(); }
    catch (err) { toast('Impossible de lire cette image'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ge-t-limit' && $('#ge-screen-hint')) $('#ge-screen-hint').textContent = `Soit ${hm(num(e.target.value))} maximum. Le temps est relevé automatiquement sur ton téléphone.`;
  if (e.target.id === 'su-first') setupDraft.first = e.target.value;
  if (e.target.id === 'su-last') setupDraft.last = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'au-pw') authAction(authMode === 'signup' ? 'signup' : 'login');
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('en-') && e.target.id !== 'en-book') { e.preventDefault(); saveEntry(); }
});
window.flfBack = () => {
  if (sheetOpen()) { closeSheet(); return true; }
  if (state.profile && tab !== 'resolutions') { tab = 'resolutions'; render(); window.scrollTo(0, 0); return true; }
  return false;
};
window.flfResume = () => { lastWeekSeen = todayKey(); reloadData(false); };
window.addEventListener('online', () => { render(); if (state.phase === 'offline') loadData(); else reloadData(false); });
window.addEventListener('offline', () => render());
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== tab) { tab = t; render(); } });

/* ============ boot ============ */
(async function boot() {
  if (IS_APP) {
    try {
      const App = plugin('App');
      App.addListener('backButton', () => { if (!window.flfBack()) App.exitApp(); });
      App.addListener('resume', () => window.flfResume());
      App.getInfo().then(i => { APP_VERSION = i.version; if (tab === 'profil') render(); }).catch(() => {});
    } catch (e) {}
  }
  backend = window.__RESOLIO_TEST_BACKEND__ || createSupabaseBackend();
  if (!backend) { state.phase = 'config'; render(); return; }

  const resetFromWeb = !IS_APP && new URLSearchParams(location.search).get('reset') === '1';
  backend.onAuth((event, user) => {
    if (event === 'PASSWORD_RECOVERY') setTimeout(() => openPasswordSheet(true), 300);
    if (user && (!state.user || state.user.id !== user.id)) { state.user = user; loadData(); }
    else if (user) state.user = user;
    else if (!user && state.user) {
      Object.assign(state, { user: null, profile: null, goals: null, weeks: {}, phase: 'auth', legacy: null });
      authMode = 'login'; tab = 'resolutions'; setupDraft.first = null; render();
    }
  });
  if (IS_APP) {
    plugin('App').addListener('appUrlOpen', async ev => {
      try {
        const kind = await backend.handleDeepLink(ev.url);
        if (kind === 'reset') setTimeout(() => openPasswordSheet(true), 600);
      } catch (e) { state.phase = state.user ? state.phase : 'auth'; authErr = errText(e); render(); }
    });
  }
  const user = await backend.getUser().catch(() => null);
  if (user && !state.user) { state.user = user; await loadData(); }
  else if (!state.user) { state.phase = 'auth'; render(); }
  if (resetFromWeb) { history.replaceState(null, '', location.pathname + location.hash); if (state.user) openPasswordSheet(true); }
})();
</script>
</body>
</html>
