name: iOS

# Construit l'app iPhone sur un Mac de GitHub (pas besoin d'avoir un Mac) :
#  - à chaque push sur main / pull request : vérifie que l'app compile (simulateur, sans signature)
#  - à chaque tag vX.Y.Z (ou lancement manuel avec « Envoyer sur TestFlight ») : signe l'app
#    et l'envoie sur App Store Connect → TestFlight, puis App Store après validation.
#
# Secrets à créer pour l'envoi (Settings → Secrets and variables → Actions), voir README :
#   APPLE_TEAM_ID      identifiant d'équipe (10 caractères, developer.apple.com → Membership)
#   ASC_KEY_ID         ID de la clé API App Store Connect (rôle Admin)
#   ASC_ISSUER_ID      Issuer ID de la clé
#   ASC_KEY_P8_BASE64  contenu du fichier AuthKey_XXXX.p8 encodé en base64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Envoyer sur TestFlight
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser Capacitor (www -> ios)
        run: npx cap sync ios

      - name: Numéro de version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$(node -p "require('./package.json').version")"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version : $NAME (build ${GITHUB_RUN_NUMBER})"

      - name: Vérifier la compilation (simulateur, sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Envoi demandé ?
        id: want
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          WANT=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.upload }}" == true ]]; then WANT=true; fi
          if [[ "$WANT" == true && -z "$ASC_KEY_P8_BASE64" ]]; then
            echo "::warning::Secrets Apple absents : l'app compile, mais rien n'est envoyé sur TestFlight (voir README, section iPhone)."
            WANT=false
          fi
          echo "upload=$WANT" >> "$GITHUB_OUTPUT"

      - name: Signer et envoyer sur TestFlight
        if: steps.want.outputs.upload == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Signature automatique : Xcode crée lui-même certificat et profil grâce à la clé API
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Resolio.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Resolio.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          rm -f "$KEY"
          echo "Envoyé sur App Store Connect : la build apparaît dans TestFlight après quelques minutes de traitement."
