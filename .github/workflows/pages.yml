name: App web (GitHub Pages)

# Publie le dossier www/ sur https://quentinfayolle34.github.io/Resolio/
# à chaque push sur main (ou à la main depuis l'onglet "Actions").
# Une seule fois avant : Settings → Pages → Source : "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la config publique
        run: |
          grep -q "supabaseUrl" www/config.js
          if grep -vE '^\s*//' www/config.js | grep -qiE "service_role|sb_secret_"; then echo "Clé secrète interdite dans www/config.js" && exit 1; fi

      - name: Nouvelle version du cache de l'app
        run: sed -i "s/resolio-shell-v1/resolio-shell-${GITHUB_SHA::8}/" www/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
